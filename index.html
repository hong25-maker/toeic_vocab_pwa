<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>TOEIC Vocab</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>TOEIC Vocab</h1>
      <p>CSV로 넣고, 오늘 외울 것만 복습</p>
    </div>
    <button id="themeBtn" class="ghost">◐</button>
  </header>

  <main>
    <section id="homeView" class="view active">
      <div class="stats-grid">
        <div class="stat"><span>전체</span><strong id="totalCount">0</strong></div>
        <div class="stat"><span>오늘 복습</span><strong id="dueCount">0</strong></div>
        <div class="stat"><span>미학습</span><strong id="newCount">0</strong></div>
        <div class="stat"><span>어려움</span><strong id="hardCount">0</strong></div>
      </div>

      <div class="card">
        <h2>오늘 공부</h2>
        <label class="row">
          <span>새 단어 포함 수</span>
          <input id="newLimit" type="number" min="0" max="100" value="20">
        </label>
        <button id="startBtn" class="primary wide">오늘 복습 시작</button>
        <button id="hardBtn" class="secondary wide">어려운 단어만 복습</button>
      </div>

      <div class="card">
        <h2>CSV 가져오기</h2>
        <p class="muted">권장 열: <code>word,meaning,pos,phrase</code></p>
        <input id="csvInput" type="file" accept=".csv,text/csv">
        <div class="button-row">
          <button id="downloadTemplateBtn" class="ghost">CSV 예시 받기</button>
          <button id="exportBtn" class="ghost">내 데이터 내보내기</button>
        </div>
        <p id="importMsg" class="muted"></p>
      </div>

      <div class="card">
        <h2>단어 관리</h2>
        <input id="searchInput" type="search" placeholder="단어 / 뜻 / 숙어 검색">
        <div id="wordList" class="word-list"></div>
      </div>
    </section>

    <section id="studyView" class="view">
      <div class="study-top">
        <button id="backBtn" class="ghost">← 종료</button>
        <span id="progressText">0 / 0</span>
      </div>

      <div id="studyCard" class="study-card">
        <div id="front">
          <div class="badge" id="posBadge"></div>
          <h2 id="wordText"></h2>
          <p id="phraseFront" class="phrase"></p>
          <p class="hint">탭해서 뜻 보기</p>
        </div>
        <div id="back" class="hidden">
          <div class="badge" id="posBadgeBack"></div>
          <h2 id="wordTextBack"></h2>
          <p id="meaningText" class="meaning"></p>
          <p id="phraseText" class="phrase"></p>
          <p id="responseTime" class="muted"></p>
        </div>
      </div>

      <div id="ratingArea" class="rating hidden">
        <button data-rate="again" class="rate again">모름</button>
        <button data-rate="hard" class="rate hard">애매</button>
        <button data-rate="good" class="rate good">앎</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
